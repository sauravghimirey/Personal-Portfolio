              <div class="hero-buttons reveal-up delay-3">

                  rel="noreferrer"
                  class="btn btn-outline"
                  >Download Resume</a

            <div class="hero-panel glass-strong card-3d reveal-scale">
              <div class="hero-scene">
                <img class="hero-gif" src="Assets/hero-portrait.gif" width="1000" height="756" alt="Animated illustration of a man in a beanie typing on a laptop" decoding="async" />
              </div>
              <div>
                <p class="hero-panel-title">Quick highlights</p>
                <ul class="hero-panel-list"></ul>
              </div>
              <div class="hero-slogan">
                <p class="hs-sa" lang="sa"></p>
                <p class="hs-en"></p>
              </div>
            </div>
          </div>
        </section>

        <!-- About section shell. Keep its IDs/classes; JavaScript fills the content. -->
<section id="about" class="section about-template">
          <div class="about-template-header">
            <h2 class="section-heading">About <span class="text-gradient-shimmer">Me</span></h2>
          </div>
          <div class="ab-grid" id="about-grid"></div>
        </section>

        <!-- Projects section shell. Keep its IDs/classes; JavaScript fills the content. -->
<section id="projects" class="section projects-template">
          <div class="projects-template-background" aria-hidden="true">
            <div class="projects-orb projects-orb-left"></div>
            <div class="projects-orb projects-orb-right"></div>
          </div>
          <div class="projects-template-header">
            <span class="projects-template-eyebrow"></span>
            <h2 class="section-heading projects-template-title"></h2>
            <p class="projects-template-subtitle"></p>
          </div>
          <div class="projects-template-grid"></div>
          <div class="projects-template-footer"></div>
        </section>

        <!-- Beyond section shell. Keep its IDs/classes; JavaScript fills the content. -->
<section id="beyond" class="section beyond-template">
          <div class="bv-bg" aria-hidden="true">
            <div class="bv-orb bv-orb-a"></div>
            <div class="bv-orb bv-orb-b"></div>
          </div>
          <div class="bv-header">
            <span class="bv-eyebrow"></span>
            <h2 class="section-heading bv-title"></h2>
            <p class="bv-subtitle"></p>
          </div>
          <ul class="bv-grid" aria-label="Photo gallery"></ul>
        </section>

        <!-- Contact section shell. Keep its IDs/classes; JavaScript fills the content. -->
<section id="contact" class="section contact-template">
          <div class="contact-template-header">
            <span class="contact-template-eyebrow"></span>
            <h2 class="section-heading"></h2>
            <p class="contact-template-subtitle"></p>
          </div>
          <div class="contact-template-grid">
            <div class="contact-template-info reveal-left"></div>
            <form id="contact-form" class="glass-strong contact-form contact-template-form reveal-right">
              <h3 class="form-title">Send a Message</h3>
              <div class="form-group">
                <label class="form-label" for="from_name">Your Name</label
                ><input id="from_name" type="text" name="from_name" required class="form-input" />
              </div>
              <div class="form-group">
                <label class="form-label" for="from_email">Your Email</label
                ><input id="from_email" type="email" name="from_email" required class="form-input" />
              </div>
              <div class="form-group">
                <label class="form-label" for="message">Message</label
                ><textarea
                  id="message"
                  name="message"
                  rows="4"
                  required
                  class="form-input"
                  style="resize: vertical"
                ></textarea>
              </div>
              <div id="form-status" class="form-status" hidden></div>
              <button type="submit" id="submit-btn" class="btn btn-primary btn-submit"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg><span>Send Message</span></button>
            </form>
          </div>
        </section>

        <footer class="site-footer" role="contentinfo">
          <div class="fc-inner">
            <span class="fc-sign" aria-hidden="true"></span>
            <ul class="fc-social"></ul>
            <small class="fc-copy"
              >© <span class="year"></span> <span class="copy-name"></span> | Learning. Building. Evolving.</small
            >
